<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Map</title>
</head>
<body>
    <a href="https://www.facebook.com/"></a>
     <img src="images/social.jpg" alt="social Media">

     <img src="images/social.jpg" usemap="#social">

          <area shape="rect" coords="154,105,195,135" href="https://www.youtube.com/?gl=IN"><!--image map.etr website for area-->
        </map>
</body>
</html>
