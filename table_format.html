<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Format </title>
</head>
<body>
     <table border="2">
        <thead>
        <tr>
            <th>Language</th>
            <th>Details</th>
        </tr>
   </thead>
   <tbody>
     <tr>
        <td rowspan="4">Web Design </td>
        <td>HTML</td>
     </tr>
     <tr>
        <td>JS</td>
     </tr>
     <tr>
        <td>CSS</td>
     </tr>
   </tbody>

   
    <table border="2">
  <thead>
    <tr>
      <th colspan="4">java</th>
       <th colspan="4">.NET</th>
    </tr>
    
  </thead>
  <tbody>
    <tr>
      <td>.NET</td>
      <td>OOPS</td>
      <td>JSP</td>
      <td>CSS</td>
    
      <td>Multiplix</td>
      <td>Sewa</td>
      <td>C</td>
      <td>BSc</td>
    </tr>
  </tbody>
</table>

</body>
</html>
